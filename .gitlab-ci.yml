# =============================================================================
# GitLab CI/CD Pipeline para Railway Deployment
# =============================================================================
# Este pipeline despliega automáticamente la aplicación a Railway
# cuando se hace push a las ramas especificadas

# Definir la imagen base para el pipeline
image: node:22-alpine

# Definir las etapas del pipeline
stages:
  - build
  - test
  - deploy

# Cache de node_modules para acelerar builds
cache:
  key:
    files:
      - yarn.lock
  paths:
    - node_modules/
    - .yarn

# Variables globales
variables:
  # Deshabilitar warnings de npm/yarn
  CI: "true"

# =============================================================================
# STAGE: Build
# =============================================================================
# Compilar la aplicación para verificar que no hay errores de sintaxis
build:
  stage: build
  script:
    - echo "📦 Instalando dependencias..."
    - yarn install --frozen-lockfile
    - echo "🔨 Compilando aplicación..."
    - yarn build
    - echo "✅ Build completado exitosamente"
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - develop
    - main
    - master

# =============================================================================
# STAGE: Test
# =============================================================================
# Ejecutar linting para verificar calidad de código (deshabilitado temporalmente)
# lint:
#   stage: test
#   script:
#     - echo "🔍 Ejecutando linting..."
#     - yarn install --frozen-lockfile
#     - yarn lint
#     - echo "✅ Linting completado"
#   only:
#     - develop
#     - main
#     - master
#   allow_failure: true  # No bloquear deploy si falla el linting

# =============================================================================
# STAGE: Deploy (Build & Push Docker Image)
# =============================================================================
# Construir imagen Docker y pushear a GitLab Container Registry
docker:build:
  stage: deploy
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    - echo "🔐 Autenticando con GitLab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "🏗️ Construyendo imagen Docker..."
    - echo "📦 Image tag - $IMAGE_TAG"
    - docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
    - echo "📤 Pusheando imagen a GitLab Container Registry..."
    - docker push $IMAGE_TAG
    - docker push $IMAGE_LATEST
    - echo "✅ Imagen publicada exitosamente"
    - echo "🎯 Imagen disponible en - $CI_REGISTRY_IMAGE"
    - echo "📌 Tag SHA - $CI_COMMIT_SHORT_SHA"
    - echo "📌 Tag Latest - latest"
  only:
    - main
    - master
  when: manual  # Requiere confirmación manual

# =============================================================================
# Notas de Configuración
# =============================================================================
# Este pipeline construye una imagen Docker y la pushea al GitLab Container Registry
# Railway puede conectarse directamente a esta imagen
#
# PASO 1: Ejecutar pipeline en GitLab
#   - El job "docker:build" construye y pushea la imagen
#   - La imagen estará disponible en: registry.gitlab.com/zeroq/reservations-mcp
#
# PASO 2: Conectar imagen en Railway
#   1. Ve a tu proyecto en Railway
#   2. Click en "Connect Image" 
#   3. Ingresa: registry.gitlab.com/zeroq/reservations-mcp:latest
#   4. Configura variables de entorno en Railway (ver env.example)
#   5. Railway desplegará automáticamente la imagen
#
# PASO 3 (Opcional): Crear Deploy Token en GitLab para Railway
#   Si el registry es privado:
#   - GitLab → Settings → Repository → Deploy Tokens
#   - Crear token con scope: read_registry
#   - Usar en Railway para autenticación
# =============================================================================

